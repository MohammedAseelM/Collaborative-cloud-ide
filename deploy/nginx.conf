server {
    listen 80;
    server_name mycloudide.com www.mycloudide.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

# After obtaining a certificate with certbot, use the HTTPS server block below
# and redirect the HTTP block to HTTPS.
server {
    listen 443 ssl;
    server_name mycloudide.com www.mycloudide.com;

    ssl_certificate /etc/letsencrypt/live/mycloudide.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mycloudide.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }
}
